<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NILMANGKORN — UX Designer who ships in code</title>
<meta name="description" content="Nadchanon Susutlertpanya (Bew) — Senior UX Designer who ships in code. Portfolio, journey and elements of practice." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+Thai:wght@400;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root" data-theme="dark">

  <header class="site-header">
    <div class="header-inner">
      <a href="#home" class="logo">
        <span class="logo-mark">🜂</span>
        <span class="logo-text">NILMANGKORN</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="header-actions">
        <button class="lang-btn" id="langBtn" type="button" aria-label="Toggle language"></button>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <section id="home" class="hero">
    <div class="hero-bg"></div>
    <div class="hero-particles" id="particles"></div>
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="kicker" id="heroKicker"></p>
        <h1 class="hero-title">NILMANGKORN</h1>
        <p class="hero-role" id="heroRole"></p>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions">
          <a href="#about" class="btn btn-primary" id="heroCta1"></a>
          <a href="#contact" class="btn btn-secondary" id="heroCta2"></a>
        </div>
        <p class="hero-note"><span class="note-line"></span><span id="heroNote"></span></p>
      </div>
      <div class="hero-visual" id="heroVisual">
        <div class="hero-glow"></div>
        <div class="hero-ring"></div>
        <img src="assets/nin-stand.png" alt="Nilmangkorn standing" class="hero-img" />
      </div>
    </div>
    <div class="scroll-indicator">
      <span class="scroll-line"></span><span id="scrollLabel"></span>
    </div>
  </section>

  <section class="stats-section">
    <div class="stats-grid" id="statsGrid"></div>
  </section>

  <section id="about" class="about-section">
    <div class="about-bg"></div>
    <div class="about-grid">
      <div class="about-copy">
        <p class="kicker" id="aboutKicker"></p>
        <h2 class="section-title about-title" id="aboutTitle"></h2>
        <p class="body-text" id="aboutP1"></p>
        <p class="body-text" id="aboutP2"></p>
        <p class="body-text quote" id="aboutP3"></p>
      </div>
      <div class="about-visual" id="aboutVisual">
        <div class="about-glow"></div>
        <img src="assets/nin-meditate.png" alt="Nilmangkorn meditating" class="about-img" />
        <div class="about-thai-tag">นิลมังกร</div>
      </div>
    </div>
  </section>

  <section id="skills" class="skills-section">
    <div class="section-inner">
      <p class="kicker" id="elKicker"></p>
      <h2 class="section-title" id="elTitle"></h2>
      <p class="hint" id="elHint"></p>

      <div class="tabs-grid" id="tabsGrid"></div>

      <div class="panel">
        <div class="panel-inner" id="panelInner">
          <div class="panel-grid">
            <div class="panel-copy">
              <p class="panel-role" id="panelRole"></p>
              <h3 class="panel-name" id="panelName"></h3>
              <p class="panel-thai" id="panelThai"></p>
              <p class="panel-desc" id="panelDesc"></p>
            </div>
            <div class="panel-items" id="panelItems"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="journey" class="journey-section">
    <div class="section-inner">
      <p class="kicker" id="journeyKicker"></p>
      <h2 class="section-title journey-title" id="journeyTitle"></h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="work" class="work-section">
    <div class="section-inner">
      <p class="kicker" id="workKicker"></p>
      <h2 class="section-title" id="workTitle"></h2>
      <p class="body-text work-desc" id="workDesc"></p>
      <div class="work-grid" id="workGrid"></div>
    </div>
  </section>

  <section id="contact" class="contact-section">
    <div class="contact-bg"></div>
    <div class="contact-grid">
      <div class="contact-copy">
        <h2 class="section-title contact-title" id="contactTitle"></h2>
        <p class="body-text" id="contactDesc"></p>
        <div class="contact-actions">
          <a href="mailto:bewblue12@gmail.com" class="btn btn-primary" id="contactEmail">bewblue12@gmail.com</a>
          <a href="tel:0944623916" class="btn btn-secondary" id="contactPhone">094 462 3916</a>
        </div>
        <div class="contact-socials" id="socials"></div>
      </div>
      <div class="contact-visual">
        <img src="assets/nin-stand.png" alt="Nilmangkorn waving" class="contact-img" />
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 Nadchanon Susutlertpanya (Bew)</span>
      <span id="footerNote"></span>
    </div>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
